# Render Blueprint pre PRUUD.
# V Renderi: New → Blueprint → vybrať repozitár mikodeee/PRUUD.
# Vytvorí sa web služba aj Postgres databáza a automaticky sa prepoja.

databases:
  - name: pruud-db
    databaseName: pruud
    plan: free
    postgresMajorVersion: "16"

services:
  - type: web
    name: pruud
    runtime: node
    plan: free
    region: frankfurt
    branch: main
    buildCommand: npm ci && npm run build
    # Migrácie bežia pri štarte, nie cez preDeployCommand — ten je na
    # Renderi dostupný až v platených plánoch. Drizzle si applikované
    # migrácie eviduje, takže opakované spustenie nič nepokazí.
    startCommand: npm run db:migrate && npm start
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: pruud-db
          property: connectionString
      # Major verzia, nie presná — Render tak doplní najnovšiu dostupnú 24.x.
      # Node 24 je potrebný: migračné skripty sú v TypeScripte a spúšťajú sa
      # priamo cez `node`, bez build kroku.
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      # Notifikácie z formulárov. Bez kľúča sa správy len logujú do konzoly
      # a web funguje aj tak.
      - key: RESEND_API_KEY
        sync: false
      - key: NOTIFY_EMAIL
        sync: false
      # Napojenie na EDC/OKTE — doplniť až po podpise zmluvy o poskytovaní
      # údajov. Kým sú prázdne, systém o priebehovom meraní nič netvrdí.
      - key: EDC_API_URL
        sync: false
      - key: EDC_API_TOKEN
        sync: false
